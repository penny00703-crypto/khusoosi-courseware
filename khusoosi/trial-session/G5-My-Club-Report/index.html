else if(d.kind==='word'){body=`<div class="vocab">${photo(d.visual,d.meaning)}<section><div class="chapter">LOOK · LISTEN · SAY</div><div class="word"><span id="headword">${ed(d.word)}</span>${listen(d.word)}</div><span class="ipa">${d.ipa}</span><span class="chip" style="float:right" lang="ar" dir="rtl">${d.ar}</span><div class="sourceWord">Word from ${d.source}</div><div class="sentence" id="example">${d.example.replace(d.word,'<b>'+d.word+'</b>')}</div><button class="hide" onclick="hideWord()">Hide / show the word</button>${['play','played','watch','watched'].includes(d.word)?`<button class="hide" aria-label="Play ${d.visual==='football'?'football':'movies'}" onclick="audio('${d.visual==='football'?'football':'movies'}')">${d.visual==='football'?'football':'movies'} ▷</button>`:''}<p id="audioStatus" class="audioStatus" role="status"></p><p class="speakPrompt">Say it → Mime it → Hide it → Say your sentence.</p></section></div>`}

else if(d.kind==='wordcheck'){let opts=B?['love','want','play','eat']:['play','watch','played','watched'];body=`<h2>${d.title}</h2><p class="small">Listen first. Then choose the word you hear.</p><button class="primary" onclick="audio('${B?'eat':'watched'}')">▶ Listen</button><div class="wordList" style="margin-top:3cqw">${opts.map(x=>`<button data-listen ${s.heard?'':'disabled'} onclick="answer(this,${x===(B?'eat':'watched')},'')">${x}</button>`).join('')}</div><p id="audioStatus" class="audioStatus" role="status"></p><p id="feedback" class="feedback" role="status"></p>`}
else if(d.kind==='grammarA')body=`<h2>${d.title}</h2><div class="grammar"><section><span class="chip">Every day</span><p>I <b>play</b> football.</p><p>I <b>watch</b> movies.</p><p class="hint">Something I do again and again.</p></section><section><span class="chip">Yesterday</span><p>I <b>played</b> football.</p><p>I <b>watched</b> movies.</p><p class="hint">Yesterday: the day before today.</p></section></div><p class="small">play → played /d/ · watch → watched /t/ · One syllable each.</p>`;
else if(d.kind==='grammarB')body=`<h2>${d.title}</h2><div class="grammar"><section><h2>What I like or want</h2><p>I <b>love</b> football.</p><p>I <b>want</b> to play.</p><p class="hint">A feeling or a wish.</p></section><section><h2>What I do</h2><p>I <b>play</b> football.</p><p>I <b>eat</b> lunch.</p><p class="hint">An action. Try miming it.</p></section></div>`;
else if(d.kind==='grammarNow')body=`<h2>${d.title}</h2><div class="grammar"><section><span class="chip">NOW</span><p>I am <b>playing</b> football.</p><p>I am <b>eating</b>.</p></section><section><h2>I am → I’m</h2><p>I’m <b>playing</b> football.</p><p>I’m <b>eating</b>.</p><p class="hint">Same meaning. A shorter way to say it.</p></section></div><p class="small">“I love football” tells a feeling. “I’m playing football” tells an action now.</p>`;
else if(['practiceA','transferA','practiceB','transferB'].includes(d.kind)){let v=d.kind==='transferA'?'watch':d.kind==='transferB'?'learner':'football';let question=d.kind==='practiceA'?'I ___ football yesterday.':d.kind==='transferA'?'I ___ movies every day.':d.kind==='practiceB'?'You are playing now. What do you say?':'You want to play. You are not playing yet.';let opts=d.kind==='practiceA'?['play','played']:d.kind==='transferA'?['watch','watched']:d.kind==='practiceB'?['I love football.',"I'm playing football."]:['I want to play.',"I'm playing football."];let correct=d.kind==='practiceA'||d.kind==='practiceB'?1:0;body=`<h2>${d.title}</h2><div class="stepbar"><span><i>1</i>Look</span><span><i>2</i>Choose</span><span><i>3</i>Say</span></div><div class="exercise">${photo(v,v==='football'?'At the football club.':v==='watch'?'Movie time':'A story character.')}<section class="prompt"><div class="sentence">${question.replace('___','<span id="gap" class="blank">…</span>')}</div><div class="twoMessages">${opts.map((x,i)=>`<button onclick="answer(this,${i===correct},'${B?'':x}')">${x}</button>`).join('')}</div><p id="feedback" class="feedback" role="status"></p></section></div>`}
else if(d.kind==='output'){body=`<h2>${d.title}</h2><p class="small">Choose. Speak first. Use a hint if you need one.</p><div class="response">${(B?['football','lunch']:['football','movies']).map(x=>`<button class="${s.choice===x?'selected':''}" onclick="S().choice='${x}';render()">${x}</button>`).join('')}</div><div class="exercise">${photo(s.choice==='movies'?'watch':s.choice, B?'Tell your friend.':'Tell both parts of your story.')}<section class="prompt output ${s.help?'help':''}"><p>${B?'1. What do you like or want?<br>2. What are you doing now?':'1. Every day…<br>2. Yesterday…'}</p><button class="hide" onclick="S().help=true;render()">Show a sentence frame</button><div class="hint">${frame().map(x=>'<div class="sentence">'+x+'</div>').join('')}</div></section></div>`}
else if(d.kind==='feedback')body=`<h2>${d.title}</h2><div class="feedbackSheet"><section><h3>Today’s words</h3><div class="wordList">${(B?['love','want','play','eat']:['play','played','watch','watched']).map(x=>`<button onclick="audio('${x}')">${x} ▷</button>`).join('')}</div><p id="audioStatus" class="audioStatus" role="status"></p></section><section><h3>My speaking</h3><p class="small">Teacher: record what you observed.</p><div class="response">${['Independent','With support','Repeated'].map(x=>`<button class="${s.observed===x?'selected':''}" onclick="S().observed='${x}';render()">${x}</button>`).join('')}</div><p>${s.observed}</p></section></div><p class="small">One small step: a word, a supported sentence, or an independent message.</p>`;
else body=`<div class="hero"><section><h1>${d.title}</h1><p>${B?'Next: walk and dance.':'Next: cook and dance.'}</p><p class="small">More activities. More stories to tell.</p><button class="primary" onclick="page=0;render()">Back to the start</button></section>${photo('friends','Thank you for learning with me.')}</div>`;
$('#stage').classList.toggle('arabic',page===0);$('#stage').classList.toggle('diaryGame',d.kind==='fill4');let stages=['Ready','Hello','Words','Grammar','Practice','Speak','Finish'];$('#stage').innerHTML=`<header class="top"><img class="brandLogo" src="assets/logo.png" alt="خصوصي"><div class="flow">${stages.map(x=>`<span class="${d.stage===x?'current':''}">${x}</span>`).join('')}</div><div class="motionTools"><button class="motionToggle" aria-pressed="${motionEnabled}" onclick="toggleMotion()">${page===0?(motionEnabled?'الحركة مفعلة':'الحركة متوقفة'):(motionEnabled?'Motion on':'Motion off')}</button><button class="tiny" onclick="guide()">${page===0?'دليل المعلم':'Teacher'}</button></div></header><div class="body">${body}</div><div class="audioViz" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><footer class="bottom"><button aria-label="${page===0?'الصفحة السابقة':'Previous page'}" onclick="go(-1)" ${page===0?'disabled':''}>←</button><span>${page===0?'١ / ١٥ · الاستعداد':`${page+1} / ${DATA[course].length} · ${d.stage}`}</span><span><button aria-label="${page===0?'إعادة الصفحة':'Reset page'}" onclick="delete states[course+page];render()">↺</button> <button aria-label="${page===0?'الصفحة التالية':'Next page'}" onclick="go(1)" ${page===DATA[course].length-1?'disabled':''}>→</button></span></footer>`;applyEd();motionAfterRender()}
function hideWord(){let d=DATA[course][page];S().hidden=!S().hidden;$('#headword').innerHTML=S().hidden?'?':ed(d.word);$('#example').innerHTML=S().hidden?d.example.replace(d.word,'…'):ed(d.example.replace(d.word,'<b>'+d.word+'</b>'))}
function answer(el,ok,word){el.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('yes','no'));el.classList.add(ok?'yes':'no');$('#feedback').textContent=ok?'✓ Yes! Now say it.':'Look at the clue. Try again.';if(ok&&word&&$('#gap'))$('#gap').textContent=word;}
function guide(){if($('.guide')){$('.guide').remove();return}let d=DATA[course][page];let a=document.createElement('aside');a.className='guide';a.innerHTML=`<button onclick="guide()">Close</button><h2>Teacher guide</h2><p>${d.stage} · ${d.time} min</p><p>${d.tg}</p><p>Model aloud, then reduce support. Word buttons use local recordings. This panel is visible on a shared screen; close it before teaching.</p>`;if(page===0){a.lang='ar';a.dir='rtl';a.innerHTML='<button onclick="guide()">إغلاق</button><h2>دليل المعلم</h2><p>تحقق من الكاميرا والميكروفون والصوت مع الطالب. اضغط على كل بطاقة بعد التأكد، ثم شغّل اختبار الصوت.</p><p>هذه الصفحة لا تسجّل الصوت أو الصورة. أغلق هذا الدليل قبل المتابعة.</p>';}$('#stage').appendChild(a)}player.addEventListener('playing',()=>document.querySelector('.audioViz')?.classList.add('active'));for(const type of ['pause','ended','error'])player.addEventListener(type,()=>document.querySelector('.audioViz')?.classList.remove('active'));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key==='Escape'&&$('.guide'))$('.guide').remove()});render();
function fitLesson(){const v=window.visualViewport;const w=v?v.width:window.innerWidth,h=v?v.height:window.innerHeight;const pad=Math.min(12,w*.015,h*.015);const scale=Math.max(.01,Math.min((w-pad*2)/1320,(h-pad*2)/742.5));const stage=document.getElementById('stage');stage.style.transform=`translate(${(w-1320*scale)/2}px,${(h-742.5*scale)/2}px) scale(${scale})`;}
window.addEventListener('resize',fitLesson);window.visualViewport?.addEventListener('resize',fitLesson);new ResizeObserver(fitLesson).observe(document.documentElement);fitLesson();
</script></html>
