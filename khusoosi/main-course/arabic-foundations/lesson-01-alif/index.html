<title>حرف الألف | Ruwaud</title>
<style>
:root{--ink:#163c39;--muted:#48635c;--teal:#08665d;--light:#e9f5ee;--line:#cdded3;--cream:#fbf9f1;--white:#fff;--gold:#f8dfa3}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Geeza Pro","Noto Sans Arabic",Tahoma,Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #be6f12;outline-offset:4px}button[disabled]{opacity:.47;cursor:default}button,.card{border-radius:16px}button{border:1px solid var(--line);padding:8px 15px;background:white;color:var(--ink)}.primary{background:var(--teal);color:white;border-color:var(--teal)}
.app{min-height:100svh;max-width:1232px;margin:auto;padding:12px 26px;display:flex;flex-direction:column;gap:12px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:8px}header{min-height:42px}.brand{width:114px;height:36px;object-fit:contain;object-position:right center}.controls{display:flex;gap:6px;align-items:center}.controls button{padding-block:5px}.progress{height:5px;background:#dce9df;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:var(--teal);transition:width .18s}
main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(15px,4vh,42px) clamp(14px,5vw,68px) 12px;background:white;border:1px solid var(--line);border-radius:30px;text-align:center;box-shadow:0 10px 26px #24442d0c}.stage{max-width:900px;width:100%;margin:auto}.phase{display:inline-block;padding:4px 14px;background:var(--light);color:var(--teal);border-radius:24px;font-weight:bold;font-size:.95rem}h1{font-size:clamp(1.7rem,4.3vw,3.5rem);margin:.14em 0;line-height:1.35}p{margin:.4em 0;line-height:1.55}.prompt{font-size:clamp(1.02rem,2.5vw,1.54rem);color:var(--muted)}.visual{display:flex;justify-content:center;align-items:center;gap:clamp(10px,3vw,32px);margin:12px 0 5px}.card{border:1px solid var(--line);background:#f4fbf7;display:grid;place-items:center;min-width:0}.model,.choice{width:clamp(96px,23vw,220px);height:clamp(135px,36vh,285px)}.glyph{font-size:clamp(86px,18vh,171px);line-height:1.3;font-weight:700}.shape{font-size:clamp(55px,10vh,100px);line-height:1.3}.rabbit{width:clamp(85px,18vw,180px);height:clamp(124px,34vh,270px);object-fit:contain;mix-blend-mode:multiply}.picture{background:#fff7de}.choice:hover,.choice[data-picked]{border-color:var(--teal);background:#e6f4ea}.choice[data-picked]{box-shadow:0 0 0 3px #1683736b}.choice[data-picked]{opacity:1}.choice.correct{border-color:#168457;background:#d7f4e1}.choice.retry{border-color:#bd7a22;background:#fff1d6}.actions{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:7px auto 0}.feedback{min-height:25px;color:var(--teal);margin:3px 0;font-weight:bold}.teacherbar{margin:6px auto 0;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}.teacherbar button{padding:4px 10px}.result{background:var(--light);padding:12px;border-radius:20px;max-width:490px;margin:10px auto}.result strong{font-size:2rem}.turns span{display:inline-block;width:.7em;height:.7em;border:1px solid var(--teal);border-radius:50%;margin:0 3px}.turns .done{background:var(--teal)}footer{min-height:42px}footer span{color:var(--muted);font-variant-numeric:tabular-nums}dialog{width:min(560px,92vw);border:1px solid var(--line);border-radius:24px;padding:25px;background:white;color:var(--ink)}dialog::backdrop{background:#163c3970}dialog h2{margin:0 0 8px}dialog p{line-height:1.8}dialog form{margin-top:10px}.ending .model{height:clamp(110px,23vh,200px)}.ending .glyph{font-size:clamp(78px,14vh,130px)}.stars{color:#996302;font-size:2rem;letter-spacing:4px}
@media(max-width:520px){.app{padding:8px 10px;gap:8px}main{border-radius:22px;padding-inline:10px}.brand{width:88px}.controls button{font-size:.8rem;padding:5px 8px}.glyph{font-size:94px}.visual{margin-top:9px}.model,.choice{width:clamp(88px,29vw,130px);height:clamp(119px,25vh,188px)}.rabbit{height:clamp(115px,24vh,177px)}}
@media(max-height:660px) and (min-width:521px){.app{gap:8px;padding-block:8px}main{padding-block:12px}.model,.choice{height:clamp(120px,29vh,175px)}.rabbit{height:clamp(112px,27vh,162px)}.ending .model{height:93px}.ending .glyph{font-size:65px}.result{padding:6px;margin:4px auto}.result p{margin:.18em 0}.stars{font-size:1.4rem}h1{font-size:clamp(1.7rem,4vw,2.55rem)}.visual{margin-top:7px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 {time:'٠–٣ دقائق',phase:'استعدّ',title:'هل تسمعني؟',prompt:'لوّح بيدك، ثم كرّر الصوت الذي تسمعه.',kind:'ready',note:'تأكّد من الصوت في الاتجاهين. اطلب من الطالب أن يلوّح إذا سمعك. قل «أَ» مرة وانظر هل يحاول التقليد. أعد المحاولة بعد ضبط الميكروفون. يكفي أن يشير أو يجيب شفهيًا، ويمكنك الضغط بدلًا منه.'},
 {time:'٣–٤ دقائق',phase:'استمع',title:'أين الأرنب؟',prompt:'أشر إلى الأرنب، ثم استمع إلى أول صوت.',kind:'rabbit',note:'اعرض الصورة وقل «أَرْنَب» مرة، ثم اعزل أول صوت «أَ». المطلوب أن يشير الطالب أو يستمع. قراءة الكلمة الكاملة اختيارية.'},
 {time:'٤–٥ دقائق',phase:'تعرّف على الشكل',title:'انظر إلى الحرف',prompt:'أشر إلى العلامة الصغيرة فوق الخط.',kind:'form',note:'أشر بالمؤشر إلى الهمزة فوق الألف، ثم دع الطالب يدلّك على مكانها. اعرض الشكل «أ» كما هو. اذكر اسم الحرف عند الحاجة فقط.'},
 {time:'٥–٧ دقائق',phase:'قل معي',title:'انظر إلى فمي',prompt:'استمع إلى التسجيل أو إلى معلّمك، ثم قُلْ أَ بصوت قصير.',kind:'model',note:'شغّل التسجيل أو انطق «أَ» قصيرة بصوت واضح. اطلب ثلاث محاولات: معك، بعدك، ثم بعد وقفة قصيرة. اضغط «سجّل محاولة» بعد كل دور شفهي. إذا مدّ الطالب الصوت، مثّل صوتًا قصيرًا بإشارة يد واحدة وأعد المحاولة.'},
 {time:'٧–٩ دقائق',phase:'اختر',title:'أين حرف أ؟',prompt:'أشر إلى البطاقة. يمكنك أيضًا قول: الأولى أو الثانية.',kind:'practice',variants:[['أ','●'],['◆','أ']],note:'الجواب هو «أ». ابدأ بمؤشر قرب الصورتين إن لزم. اضغط البطاقة التي يشير إليها الطالب. بعد محاولته، بدّل البطاقتين. التصحيح: أشر إلى الهمزة ثم دع الطالب يحاول ثانية.'},
 {time:'٩–١٢ دقيقة',phase:'اسمع واختر',title:'أيّ بطاقة سمعت؟',prompt:'استمع إلى التسجيل أو إلى معلّمك، ثم اختر البطاقة.',kind:'practice',hasSample:true,variants:[['●','أَ'],['أَ','◆']],note:'شغّل التسجيل أو قل «أَ» مرة. انتظر الاختيار قبل أن تكشفه بالنقر. أعد الصوت إذا احتاج. عند الخطأ أشر إلى الشكل، ثم بدّل إلى الجولة الثانية لإعادة القياس.'},
 {time:'١٢–١٥ دقيقة',phase:'حان دورك',title:'قل الصوت وحدك',prompt:'انظر إلى البطاقة. خذ وقتك، ثم اقرأ.',kind:'oral',variants:['أَ','أَ'],note:'انتظر ٣–٤ ثوانٍ قبل أي مساعدة. في المحاولة الثانية تتغيّر هيئة البطاقة. الطلب هو «أَ» قصيرة. إذا توقف، قدّم إشارة فم صامتة، ثم سجّل أن القراءة تمت بمساعدة في دليل نهاية الدرس.'},
 {time:'١٥–١٨ دقيقة',phase:'نقرأ بلا صورة',title:'تختفي الصورة ويبقى الصوت',prompt:'اقرأ مع الصورة، ثم اقرأ بعد اختفائها.',kind:'fade',note:'في الجولة الأولى استعمل الصورة إذا لزم. اضغط «إخفاء الصورة»، ثم أشر إلى البطاقة وحدها. اطلب قراءة مستقلة قبل أي نموذج. كرّر جولة أخرى فقط لتثبيت الانتقال.'},
 {time:'١٨–٢٢ دقيقة',phase:'جرّب مرّة أخرى',title:'نصلح شيئًا واحدًا',prompt:'استمع أو انظر إلى التلميح، ثم جرّب البطاقة الجديدة.',kind:'repair',note:'اختر تلميحًا واحدًا: إن أخطأ في الشكل فأشر إلى العلامة فوق الخط؛ وإن مدّ الصوت فانطق «أَ» قصيرة؛ وإن كان مستعدًا فانتقل مباشرة إلى بطاقة جديدة. اطلب قراءة جديدة ثم أغلق التلميح قبل التحدي.'},
 {time:'٢٢–٢٥ دقيقة',phase:'تحدّي أ',title:'الآن دورك',prompt:'استمع وانظر، ثم اقرأ وحدك.',kind:'quiz',note:'خمس محاولات: ثلاث اختيارات ومحاولتا نطق. الأولى والثالثة «أين الحرف؟»، والثانية قل «أَ» ليختار. في الأخيرتين انتظر القراءة قبل التسجيل. اضغط «صحيح وحده» عند القراءة المستقلة، أو «بمساعدة» بعد نموذج، أو «نراجع» عند عدم التمكن. لا تنطق في محاولتي القراءة قبل أن يحاول الطالب.'},
 {time:'ختام الدرس',phase:'ماذا تعلمنا؟',title:'صوت اليوم',prompt:'أشر إلى الحرف واقرأ صوته مرّة أخيرة.',kind:'summary',note:'اذكر شيئًا واحدًا فعله الطالب، ومهارة واحدة سنراجعها. معيار الانتقال: ٤/٥ مستقلّة مع قراءة مستقلة واحدة على الأقل. إن لم يصل إليها، ابدأ الحصة التالية بمحاولات على أ قبل إضافة الجديد.'}
];
const quiz = [
 {choices:['أ','●'],text:'أين الحرف؟'},
 {choices:['◆','أَ'],text:'اسمع صوت معلّمك واختر.'},
 {choices:['–','أ'],text:'أشر إلى الحرف في البطاقة الجديدة.'},
 {text:'اقرأ البطاقة بصوتك.'},
 {text:'اقرأ في هذه البطاقة أيضًا.'}
];
const qs=(sel)=>document.querySelector(sel);
const main=qs('#slide');
const dialog=qs('#dialog');
const state=slides.map(()=>({round:0,choice:null,hidden:false,tip:'',turns:0,revealed:false}));
let page=0;
const results=[];
const choiceMarkup=(items,picked,show=true)=>items.map((value,i)=>{
  const answer=value.startsWith('أ');
  const selected=i===picked;
  const css=selected && show?(answer?'correct':'retry'):'';
  const uniqueLabel=answer?value:'شكل '+(i===0?'١':'٢');
  return '<button class="card choice '+css+'" data-choice="'+i+'" '+(selected?'data-picked ':'')+'aria-label="'+uniqueLabel+'" '+(picked!==null?'disabled':'')+'><span class="'+(answer?'glyph':'shape')+'">'+value+'</span></button>';
}).join('');
const visual=(s)=>'<div class="visual">'+s+'</div>';
const control=(code,label,cls='')=>'<button data-action="'+code+'" class="'+cls+'">'+label+'</button>';
const sample=qs('#sample');
const sampleControl=()=>control('play-sample','🔊 استمع')+'<span role="status" data-audio-status hidden></span>';
const actions=(s)=>'<div class="actions">'+s+'</div>';
const feedback=(msg='')=>'<p class="feedback" role="status">'+msg+'</p>';
const choiceCorrect=(items,index)=>items[index]?.startsWith('أ')===true;
function render(focus=false) {
  const s=slides[page], st=state[page];
  let body='', prompt=s.prompt;
  switch(s.kind){
    case 'ready':
      body=visual(rabbitCard)+actions(control('ready',st.revealed?'أعد المحاولة':'الصوت واضح','primary'))+feedback(st.revealed?'ممتاز، حان وقت الاستماع.':'');
      break;
    case 'rabbit':
      body=visual(rabbitCard)+actions(control('found',st.revealed?'أشر مرة أخرى':'وجدتُه','primary'))+feedback(st.revealed?'أحسنت! استمع إلى الصوت الأول.':'');
      break;
    case 'form':
      body=visual(glyph('أ'))+actions(control('show-mark',st.revealed?'أخفِ التلميح':'أظهر التلميح'))+feedback(st.revealed?'انظر فوق الخط.':'');
      break;
    case 'model':
      body=visual(glyph('أَ'))+'<div class="turns" aria-label="عدد المحاولات">'+[0,1,2].map(i=>'<span '+(i<st.turns?'class="done"':'')+'></span>').join('')+'</div>'+actions(sampleControl()+control('turn',st.turns===3?'أعد الجولات':'سجّل محاولة','primary'))+feedback(st.turns===3?'ثلاث محاولات، أحسنت!':'');
      break;
    case 'practice': {
      const items=s.variants[st.round];
      body=visual(choiceMarkup(items,st.choice))+feedback(st.choice===null?'':choiceCorrect(items,st.choice)?'أحسنت!':'انظر إلى العلامة فوق الخط، ثم جرّب مرة أخرى.')+
        actions((s.hasSample?sampleControl():'')+control('retry','محاولة من جديد')+control('swap','بدّل البطاقتين','primary'));
      break;
    }
    case 'oral':
      body=visual(st.round?swapGlyph('أَ'):glyph('أَ'))+actions(control('swap','بطاقة أخرى','primary'));
      break;
    case 'fade':
      body=visual((st.hidden?'':rabbitCard)+glyph('أَ'))+actions(control('fade',st.hidden?'أظهر الصورة':'أخفِ الصورة','primary'));
      break;
    case 'repair':
      body=visual(st.round?swapGlyph('أَ'):glyph(st.tip==='shape'?'أ':'أَ'))+
        actions(control('shape','تلميح الشكل')+control('sound','تلميح الصوت')+control('swap','بطاقة جديدة','primary'))+
        feedback(st.tip==='shape'?'أشر إلى العلامة فوق الخط.':st.tip==='sound'?'استمع إلى أَ قصيرة، ثم قلها.':'');
      break;
    case 'quiz': {
      const q=quiz[st.round], saved=results[st.round];
      prompt=q.text;
      if(q.choices){
        body=visual(choiceMarkup(q.choices,saved?.choice??null,false));
      } else {
        body=visual(st.round===4?swapGlyph('أَ'):glyph('أَ'))+
          '<div class="teacherbar"><span>تسجيل المعلّم</span>'+
          [['solo','صحيح وحده'],['help','بمساعدة'],['review','نراجع']].map(([key,label])=>'<button data-score="'+key+'" '+(saved?'disabled':'')+'>'+label+'</button>').join('')+'</div>';
      }
      body+=feedback(saved?'تمّت المحاولة.':'')+'<div class="actions"><span dir="ltr">'+(st.round+1)+' / 5</span>'+
        (st.round>0?control('quiz-back','المحاولة السابقة'):'')+
        (saved?control('quiz-reset','أعد هذه المحاولة')+control('quiz-next',st.round===4?'أنهِ التحدّي':'المحاولة التالية','primary'):'')+'</div>';
      break;
    }
    case 'summary': {
      const complete=results.filter(Boolean).length===5;
      const total=results.filter(r=>r?.status==='solo').length;
      const ready=complete && total>=4 && results.slice(3).some(r=>r?.status==='solo');
      body='<div class="ending">'+visual(glyph('أَ'))+'</div>'+(complete?'<div class="result"><div class="stars" aria-hidden="true">'+(ready?'★ ★ ★':'★')+'</div><strong dir="ltr">'+total+' / 5</strong><p>محاولات مستقلّة صحيحة</p><p>'+(ready?'أحسنت، قرأت الصوت بنفسك.':'أحسنت المحاولة! سنتمرّن على الصوت مرّة أخرى.')+'</p></div>':'')+
        actions(control('quiz-return',complete?'ارجع إلى التحدّي':'أكمل التحدّي'));
      break;
    }
  }
  main.innerHTML='<section class="stage"><div class="phase">'+s.phase+'</div><h1 tabindex="-1">'+s.title+'</h1><p class="prompt">'+prompt+'</p>'+body+'</section>';
  qs('#page').textContent=(page+1)+' / '+slides.length;
  qs('#progress').style.width=(page+1)/slides.length*100+'%';
  qs('#prev').disabled=page===0;
  qs('#next').disabled=page===slides.length-1 || s.kind==='quiz';
  if(focus) main.querySelector('h1').focus({preventScroll:true});
}
function go(to){
  if(to>=0 && to<slides.length){sample.pause();page=to;render(true);}
}
main.addEventListener('click',event=>{
 const button=event.target.closest('button');
 if(!button)return;
 if(button.dataset.action==='play-sample'){
   const status=main.querySelector('[data-audio-status]');
   status.hidden=true;
   sample.currentTime=0;
   sample.play().catch(error=>{
     if(error.name==='AbortError')return;
     status.textContent='تعذّر تشغيل الصوت. استمع إلى معلّمك.';
     status.hidden=false;
   });
   return;
 }
 const st=state[page], s=slides[page];
 if(button.dataset.choice!==undefined){
   const index=Number(button.dataset.choice);
   if(s.kind==='quiz'){
     const items=quiz[st.round].choices;
     results[st.round]={choice:index,status:choiceCorrect(items,index)?'solo':'review'};
   }else st.choice=index;
 } else if(button.dataset.score){
   results[st.round]={status:button.dataset.score};
 } else switch(button.dataset.action){
   case 'ready': case 'found': case 'show-mark': st.revealed=!st.revealed; break;
   case 'turn': st.turns=(st.turns+1)%4; break;
   case 'retry': st.choice=null; break;
   case 'swap': st.round=1-st.round; st.choice=null; st.tip=''; break;
   case 'fade': st.hidden=!st.hidden; break;
   case 'shape': case 'sound': st.tip=button.dataset.action; break;
   case 'quiz-back':st.round--;break;
   case 'quiz-reset':delete results[st.round];break;
   case 'quiz-next':
     if(st.round===4){go(page+1);return;}
     st.round++;break;
   case 'quiz-return':go(page-1);return;
 }
 render();
 const original = [...main.querySelectorAll('button')].find(b=>!b.disabled && b.dataset.action && b.dataset.action===button.dataset.action);
 const target=original || main.querySelector('button:not([disabled])');
 target?.focus({preventScroll:true});
});
qs('#next').onclick=()=>go(page+1);
qs('#prev').onclick=()=>go(page-1);
function openDialog(title,body,reset=false){
 qs('#dialog-title').textContent=title;qs('#dialog-body').textContent=body;qs('#confirm').hidden=!reset;
 dialog.returnValue='close';
 dialog.showModal();
}
qs('#guide').onclick=()=>openDialog(slides[page].time,slides[page].note);
qs('#reset').onclick=()=>openDialog('إعادة الدرس','سيعود الدرس إلى البداية وستُمسح محاولات هذه الجلسة.',true);
dialog.addEventListener('close',()=>{
 if(dialog.returnValue!=='reset')return;
 for(const st of state) Object.assign(st,{round:0,choice:null,hidden:false,tip:'',turns:0,revealed:false});
 results.length=0;go(0);
});
render();
</script>
</body>
</html>
